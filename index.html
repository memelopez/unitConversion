<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSS -->
   <link rel="stylesheet" href="index.css">
  <title>Unit Conversion</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>Metric/Imperial Unit Conversion</h1>
      <input type="number" name="inputUnits" id="inputUnits" value="20">
      <button type="button" class="convert">Convert</button>
    </header>
    <div class="results">
      <div class="forLength">
        <h2>Length (Meter/Feet)</h2>
        <p id="length">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
      </div>
      <div class="forVolume">
        <h2>Volume (Liters/Gallons)</h2>
        <p id="volume">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
      </div>
      <div class="forMass">
        <h2>Mass (Kilograms/Pounds)</h2>
        <p id="mass">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
